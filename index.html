        function DataGuruView({ teachers, setTeachers, showNotice }) {
            const [showAddModal, setShowAddModal] = useState(false);
            const [editTeacher, setEditTeacher] = useState(null);

            // Form state
            const [nip, setNip] = useState('');
            const [nama, setNama] = useState('');
            const [hp, setHp] = useState('');
            const [selectedMapel, setSelectedMapel] = useState([]);

            const handleMapelToggle = (mapel) => {
                if (selectedMapel.includes(mapel)) {
                    setSelectedMapel(selectedMapel.filter(m => m !== mapel));
                } else {
                    setSelectedMapel([...selectedMapel, mapel]);
                }
            };

            const openAddForm = () => {
                setEditTeacher(null);
                setNip('');
                setNama('');
                setHp('');
                setSelectedMapel([]);
                setShowAddModal(true);
            };

            const openEditForm = (t) => {
                setEditTeacher(t);
                setNip(t.nip);
                setNama(t.nama);
                setHp(t.hp);
                setSelectedMapel(t.mapel || []);
                setShowAddModal(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (selectedMapel.length === 0) {
                    showNotice("Perhatian", "Pilih minimal satu mata pelajaran yang diampu oleh guru!", "error");
                    return;
                }

                if (editTeacher) {
                    setTeachers(teachers.map(t => t.id === editTeacher.id ? { ...t, nip, nama, hp, mapel: selectedMapel } : t));
                    showNotice("Berhasil", "Data Guru berhasil diperbarui", "success");
                } else {
                    const newTeacher = {
                        id: Date.now(),
                        nip,
                        nama,
                        hp,
                        mapel: selectedMapel
                    };
                    setTeachers([...teachers, newTeacher]);
                    showNotice("Berhasil", "Guru baru berhasil ditambahkan", "success");
                }
                setShowAddModal(false);
            };

            const handleDelete = (id) => {
                setTeachers(teachers.filter(t => t.id !== id));
                showNotice("Terhapus", "Data guru telah dihapus", "info");
            };

            // Excel Download & Import format simulator
            const downloadExcelTemplate = () => {
                const templateData = [
                    ["NIP", "NAMA_GURU", "NO_HP", "MATA_PELAJARAN"],
                    ["198501012010011001", "Ust. Ahmad Syarif, S.Ag.", "081233445566", "Ilmu Nahwu (Mulok)"],
                    ["199203042018022002", "Ibu Dewi Lestari, S.Pd.", "085677889900", "Bahasa Sunda (Mulok);Bahasa Indonesia"]
                ];
                const ws = XLSX.utils.aoa_to_sheet(templateData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Format_Guru");
                XLSX.writeFile(wb, "Template_Data_Guru_MTs_Buninagara.xlsx");
            };

            const handleExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const data = XLSX.utils.sheet_to_json(ws);

                        let addedCount = 0;
                        const importedTeachers = data.map((row, index) => {
                            const mapels = row.MATA_PELAJARAN ? row.MATA_PELAJARAN.split(';').map(m => m.trim()) : ["Bahasa Sunda (Mulok)"];
                            addedCount++;
                            return {
                                id: Date.now() + index,
                                nip: row.NIP ? String(row.NIP) : `NIP-${Math.floor(1000 + Math.random()*9000)}`,
                                nama: row.NAMA_GURU || "Guru Tanpa Nama",
                                hp: row.NO_HP ? String(row.NO_HP) : "-",
                                mapel: mapels
                            };
                        });

                        setTeachers([...teachers, ...importedTeachers]);
                        showNotice("Import Berhasil", `Berhasil mengimpor ${addedCount} data guru dari file Excel.`, "success");
                    } catch (err) {
                        showNotice("Gagal Import", "Format file Excel tidak sesuai standar template!", "error");
                    }
                };
                reader.readAsBinaryString(file);
            };

            return (
                <div class="space-y-5">
                    {/* Header Controls */}
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">

                            <p class="text-xs text-slate-500">Kelola informasi tenaga pengajar dan alokasi mata pelajaran</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button 
                                onClick={downloadExcelTemplate} 
                                class="bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 text-xs px-3 py-2 rounded-xl font-semibold transition flex items-center space-x-1"
                            >
                                <i class="fa-solid fa-download"></i>
                                <span>Unduh Format Excel</span>
                            </button>
                            <label class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs px-3 py-2 rounded-xl font-semibold cursor-pointer transition flex items-center space-x-1">
                                <i class="fa-solid fa-file-excel"></i>
                                <span>Upload Excel</span>
                                <input type="file" accept=".xlsx, .xls, .csv" class="hidden" onChange={handleExcelUpload} />
                            </label>
                            <button 
                                onClick={openAddForm} 
                                class="bg-mts-700 hover:bg-mts-800 text-white text-xs px-3 py-2 rounded-xl font-semibold transition shadow flex items-center space-x-1"
                            >
                                <i class="fa-solid fa-plus"></i>
                                <span>Tambah Guru Baru</span>
                            </button>
                        </div>
                    </div>

                    {/* Table of Teachers */}
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-100 text-slate-700 font-bold uppercase tracking-wider border-b border-slate-200">
                                    <tr>
                                        <th class="p-3">No</th>

        function RuangUjianView({ exams, setExams, currentUser, showNotice }) {
            const [selectedExam, setSelectedExam] = useState(null);
            const [showCreateModal, setShowCreateModal] = useState(false);

            // New Exam state
            const [judul, setJudul] = useState('');
            const [mapel, setMapel] = useState(MAPEL_LIST[0]);
            const [kelas, setKelas] = useState('8A');
            const [kkm, setKkm] = useState(75);
            const [durasi, setDurasi] = useState(60);

            // Manual question builder state inside exam edit
            const [newTipe, setNewTipe] = useState('PG');
            const [pertanyaan, setPertanyaan] = useState('');
            const [opsiA, setOpsiA] = useState('');
            const [opsiB, setOpsiB] = useState('');
            const [opsiC, setOpsiC] = useState('');
            const [opsiD, setOpsiD] = useState('');
            const [kunci, setKunci] = useState('A');
            const [kunciEssay, setKunciEssay] = useState('');
            const [bobot, setBobot] = useState(20);

            const handleCreateExam = (e) => {
                e.preventDefault();
                const newExam = {
                    id: Date.now(),
                    judul,
                    mapel,
                    kelas,
                    kkm: Number(kkm),
                    durasi: Number(durasi),
                    status: 'Aktif',
                    guruPengampu: currentUser.name || 'Guru MTs',
                    pengawas: 'Pengawas Ujian',
                    soal: []
                };
                setExams([...exams, newExam]);
                setShowCreateModal(false);
                showNotice("Berhasil", "Ruang Ujian baru dibuat! Sekarang tambahkan soal PG / Essay.", "success");
            };

            const handleAddQuestion = (e) => {
                e.preventDefault();
                if (!selectedExam) return;

                const newQuestion = {
                    id: Date.now(),
                    tipe: newTipe,
                    pertanyaan,
                    opsiA: newTipe === 'PG' ? opsiA : '',
                    opsiB: newTipe === 'PG' ? opsiB : '',
                    opsiC: newTipe === 'PG' ? opsiC : '',
                    opsiD: newTipe === 'PG' ? opsiD : '',
                    kunci: newTipe === 'PG' ? kunci : '',
                    kunciJawaban: newTipe === 'Essay' ? kunciEssay : '',
                    bobot: Number(bobot)
                };

                const updatedExam = {
                    ...selectedExam,
                    soal: [...selectedExam.soal, newQuestion]
                };

                setExams(exams.map(e => e.id === selectedExam.id ? updatedExam : e));
                setSelectedExam(updatedExam);
                // Reset form
                setPertanyaan('');
                setOpsiA(''); setOpsiB(''); setOpsiC(''); setOpsiD('');
                setKunciEssay('');
                showNotice("Soal Ditambahkan", "Soal baru berhasil disimpan ke ruang ujian ini.", "success");
            };

            // Excel Question Import format generator
            const downloadSoalTemplate = () => {
                const data = [
                    ["TIPE_SOAL", "PERTANYAAN", "OPSI_A", "OPSI_B", "OPSI_C", "OPSI_D", "KUNCI_PG", "KUNCI_ESSAY", "BOBOT"],
                    ["PG", "Naon nuduhkeun kana fi'il mudhari?", "Pekerjaan lampau", "Pekerjaan sedang/akan", "Kata benda", "Kata sifat", "B", "", 25],
                    ["Essay", "Sebutkeun 2 conto kalimat basa Sunda lemes!", "", "", "", "", "", "Abdi nuju neda. Anjeunna nuju tuang.", 50]
                ];
                const ws = XLSX.utils.aoa_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Template_Soal");
                XLSX.writeFile(wb, "Template_Import_Soal_MTs.xlsx");
            };

            const handleImportSoalExcel = (e) => {
                const file = e.target.files[0];
                if (!file || !selectedExam) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const ws = wb.Sheets[wb.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(ws);

                        const newSoals = rows.map((r, idx) => ({
                            id: Date.now() + idx,
                            tipe: r.TIPE_SOAL || "PG",
                            pertanyaan: r.PERTANYAAN || "Pertanyaan",
                            opsiA: r.OPSI_A || "",
                            opsiB: r.OPSI_B || "",
                            opsiC: r.OPSI_C || "",
                            opsiD: r.OPSI_D || "",
                            kunci: r.KUNCI_PG || "A",
                            kunciJawaban: r.KUNCI_ESSAY || "",
                            bobot: Number(r.BOBOT) || 20
                        }));

                        const updatedExam = {
                            ...selectedExam,
                            soal: [...selectedExam.soal, ...newSoals]
                        };

                        setExams(exams.map(ex => ex.id === selectedExam.id ? updatedExam : ex));
                        setSelectedExam(updatedExam);
                        showNotice("Import Berhasil", `Berhasil menambah ${newSoals.length} soal dari file Excel!`, "success");
                    } catch (err) {
                        showNotice("Gagal Import", "File Excel soal tidak sesuai format!", "error");
                    }
                };
                reader.readAsBinaryString(file);
            };

            return (
                <div class="space-y-5">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">

                            {exams.map(e => (
                                <div 
                                    key={e.id}

                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">{e.status}</span>
                                    </div>
                                    <h4 class="font-bold text-sm text-slate-800 mb-1">{e.judul}</h4>
                                    <p class="text-xs text-slate-500 font-medium mb-2">{e.mapel}</p>

                                        <span>KKM: <b>{e.kkm}</b></span>

        function PortalSiswaView({ currentUser, exams, results, setResults, showNotice }) {
            const [activeExam, setActiveExam] = useState(null);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [answers, setAnswers] = useState({}); // { questionId: answerVal }
            const [flagged, setFlagged] = useState({}); // { questionId: boolean }
            const [timeLeft, setTimeLeft] = useState(0); // seconds
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [lastScore, setLastScore] = useState(null);

            // Timer countdown
            useEffect(() => {
                if (!activeExam || isSubmitted || timeLeft <= 0) return;

                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmitExam();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, [activeExam, isSubmitted, timeLeft]);

            const handleStartExam = (exam) => {
                setActiveExam(exam);
                setCurrentQuestionIndex(0);
                setAnswers({});
                setFlagged({});
                setTimeLeft(exam.durasi * 60);
                setIsSubmitted(false);
                setLastScore(null);
            };

            const handleSelectAnswer = (qId, optionVal) => {
                setAnswers({ ...answers, [qId]: optionVal });
            };

            const toggleFlag = (qId) => {
                setFlagged({ ...flagged, [qId]: !flagged[qId] });
            };

            const handleSubmitExam = () => {
                if (!activeExam) return;

                let scorePG = 0;
                let totalMaxBobot = 0;

                activeExam.soal.forEach(q => {
                    totalMaxBobot += q.bobot;
                    if (q.tipe === 'PG') {
                        if (answers[q.id] === q.kunci) {
                            scorePG += q.bobot;
                        }
                    } else {
                        // Essay estimated default allocation if answered
                        if (answers[q.id] && answers[q.id].trim().length > 5) {
                            scorePG += Math.round(q.bobot * 0.8);
                        }
                    }
                });

                const isPass = scorePG >= activeExam.kkm;
                const newResult = {
                    id: Date.now(),
                    examId: activeExam.id,
                    nisn: currentUser.nisn,
                    namaSiswa: currentUser.nama,
                    kelas: currentUser.kelas,
                    mapel: activeExam.mapel,
                    skorPG: scorePG,
                    skorEssay: 0,
                    totalNilai: scorePG,
                    status: isPass ? 'Tuntas' : 'Belum Tuntas',
                    waktuSubmit: new Date().toLocaleString()
                };

                setResults([newResult, ...results]);
                setLastScore(newResult);
                setIsSubmitted(true);
                showNotice("Ujian Selesai", `Jawaban Anda berhasil dikirim! Nilai Anda: ${scorePG}`, "success");
            };

            // Format timer HH:MM:SS
            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            };

            if (isSubmitted && lastScore) {
                return (
                    <div class="max-w-md mx-auto bg-white p-6 rounded-2xl border border-slate-200 shadow-xl text-center space-y-4 my-8">
                        <div class="w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-3xl mx-auto">
                            <i class="fa-solid fa-trophy"></i>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800">Ujian Telah Selesai!</h3>
                        <p class="text-xs text-slate-500">Hasil pengerjaan Anda telah tersimpan secara resmi di server MTs Buninagara.</p>
                        
                        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm space-y-2">
                            <p class="text-slate-600">Siswa: <b>{lastScore.namaSiswa}</b> ({lastScore.nisn})</p>
                            <p class="text-slate-600">Mata Pelajaran: <b>{lastScore.mapel}</b></p>
                            <div class="text-3xl font-black text-emerald-700 py-2">
                                {lastScore.totalNilai} <span class="text-xs text-slate-400 font-normal">/ 100</span>
                            </div>
                            <span class={`inline-block px-3 py-1 rounded-full text-xs font-bold ${lastScore.status === 'Tuntas' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}`}>
                                Status KKM: {lastScore.status}
                            </span>
                        </div>

                        <button onClick={() => setActiveExam(null)} class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs transition">
                            Kembali ke Daftar Ujian
                        </button>
                    </div>
                );
            }

            if (activeExam) {
                const q = activeExam.soal[currentQuestionIndex];
                if (!q) return null;

                return (
                    <div class="space-y-4 max-w-4xl mx-auto">
                        {/* Exam Top Status Bar */}
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between sticky top-16 z-20">
                            <div>
                                <h3 class="font-bold text-slate-800 text-sm">{activeExam.judul}</h3>
                                <p class="text-xs text-slate-500">Soal Ke-{currentQuestionIndex + 1} dari {activeExam.soal.length}</p>
                            </div>
                            <div class="bg-amber-50 border border-amber-300 text-amber-800 px-3 py-1.5 rounded-xl flex items-center space-x-1.5 font-mono text-sm font-bold">
                                <i class="fa-regular fa-clock animate-pulse"></i>
                                <span>{formatTime(timeLeft)}</span>
                            </div>
                        </div>

                        {/* Main Question Card & Options */}
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="md:col-span-2 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                                <div class="flex justify-between items-center text-xs text-slate-500 border-b pb-2">
                                    <span class="font-semibold text-mts-700">Tipe: {q.tipe} (Bobot: {q.bobot})</span>
                                    <button 
                                        onClick={() => toggleFlag(q.id)} 
                                        class={`px-2.5 py-1 rounded-lg text-xs font-medium flex items-center space-x-1 ${flagged[q.id] ? 'bg-amber-500 text-white' : 'bg-slate-100 text-slate-600'}`}
                                    >
                                        <i class="fa-solid fa-flag"></i>
                                        <span>Ragu-Ragu</span>
                                    </button>
                                </div>

                                <p class="text-sm md:text-base font-medium text-slate-800 leading-relaxed">
                                    {currentQuestionIndex + 1}. {q.pertanyaan}
                                </p>

                                {q.tipe === 'PG' ? (
                                    <div class="space-y-2 pt-2">
                                        {['A', 'B', 'C', 'D'].map(optKey => {
                                            const optText = q[`opsi${optKey}`];
                                            const isChecked = answers[q.id] === optKey;
                                            return (
                                                <button
                                                    key={optKey}
                                                    onClick={() => handleSelectAnswer(q.id, optKey)}
                                                    class={`w-full text-left p-3 rounded-xl text-xs md:text-sm transition flex items-center space-x-3 border ${isChecked ? 'bg-emerald-50 border-emerald-500 text-emerald-900 font-semibold ring-2 ring-emerald-500/20' : 'bg-slate-50 border-slate-200 hover:bg-slate-100 text-slate-700'}`}
                                                >
                                                    <span class={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-xs ${isChecked ? 'bg-emerald-600 text-white' : 'bg-white border text-slate-500'}`}>
                                                        {optKey}
                                                    </span>
                                                    <span>{optText}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div class="pt-2">
                                        <textarea
                                            rows="4"
                                            placeholder="Tuliskan jawaban essay Anda di sini secara rinci..."
                                            value={answers[q.id] || ''}
                                            onChange={(e) => handleSelectAnswer(q.id, e.target.value)}
                                            class="w-full p-3 bg-slate-50 border border-slate-300 rounded-xl text-xs md:text-sm focus:ring-2 focus:ring-mts-500"
                                        ></textarea>
                                    </div>
                                )}

                                {/* Bottom navigation controls */}
                                <div class="flex justify-between pt-4 border-t border-slate-100">
                                    <button 
                                        disabled={currentQuestionIndex === 0}
                                        onClick={() => setCurrentQuestionIndex(prev => prev - 1)}
                                        class="px-4 py-2 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 text-slate-700 rounded-xl text-xs font-semibold"
                                    >
                                        &larr; Sebelumnya
                                    </button>

                                    {currentQuestionIndex < activeExam.soal.length - 1 ? (
                                        <button 
                                            onClick={() => setCurrentQuestionIndex(prev => prev + 1)}
                                            class="px-4 py-2 bg-mts-700 hover:bg-mts-800 text-white rounded-xl text-xs font-semibold shadow"
                                        >
                                            Selanjutnya &rarr;
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={handleSubmitExam}
                                            class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-lg"
                                        >
                                            Selesaikan Ujian
                                        </button>
                                    )}
                                </div>
                            </div>

                            {/* Question Numbers Grid Side Nav */}
                            <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3 h-fit">
                                <h4 class="font-bold text-xs uppercase text-slate-600">Navigasi Nomor Soal:</h4>
                                <div class="grid grid-cols-5 gap-2">
                                    {activeExam.soal.map((sq, idx) => {
                                        const isAnswered = !!answers[sq.id];
                                        const isFlagged = !!flagged[sq.id];
                                        const isCurrent = idx === currentQuestionIndex;

                                        return (
                                            <button
                                                key={sq.id}
                                                onClick={() => setCurrentQuestionIndex(idx)}
                                                class={`p-2 rounded-lg text-xs font-bold transition relative border ${
                                                    isCurrent ? 'ring-2 ring-mts-600 border-mts-600' : ''
                                                } ${
                                                    isFlagged ? 'bg-amber-400 text-white border-amber-500' :
                                                    isAnswered ? 'bg-emerald-600 text-white border-emerald-700' : 'bg-slate-100 text-slate-700 border-slate-200'
                                                }`}
                                            >
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>

                                <div class="text-[11px] text-slate-500 space-y-1 pt-2 border-t">
                                    <div class="flex items-center space-x-2"><div class="w-3 h-3 bg-emerald-600 rounded"></div><span>Sudah dijawab</span></div>
                                    <div class="flex items-center space-x-2"><div class="w-3 h-3 bg-amber-400 rounded"></div><span>Ragu-ragu</span></div>
                                    <div class="flex items-center space-x-2"><div class="w-3 h-3 bg-slate-100 border rounded"></div><span>Belum dijawab</span></div>
                                </div>

                                <button onClick={handleSubmitExam} class="w-full mt-2 bg-red-600 hover:bg-red-700 text-white font-bold py-2 rounded-xl text-xs shadow">
                                    Kirim Jawaban Sekarang
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div class="space-y-5">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-800">Portal Ujian Siswa MTs Buninagara</h2>
                        <p class="text-xs text-slate-500">Pilih paket ujian aktif sesuai kelas Anda di bawah ini untuk memulai pengerjaan</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {exams.filter(e => e.status === 'Aktif').map(e => (
                            <div key={e.id} class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition space-y-3">
                                <div class="flex items-center justify-between">
                                    <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded">KELAS {e.kelas}</span>
                                    <span class="text-xs text-slate-500"><i class="fa-regular fa-clock mr-1"></i>{e.durasi} Menit</span>
                                </div>
                                <h3 class="font-bold text-slate-800 text-base">{e.judul}</h3>
                                <p class="text-xs text-slate-600 font-semibold">Mapel: {e.mapel}</p>
                                <div class="text-xs text-slate-500 flex justify-between bg-slate-50 p-2.5 rounded-xl">
                                    <span>Guru: <b>{e.guruPengampu}</b></span>
                                    <span>Jumlah Soal: <b>{e.soal.length}</b></span>
                                </div>

                                <button onClick={() => handleStartExam(e)} class="w-full bg-mts-700 hover:bg-mts-800 text-white font-bold py-2.5 rounded-xl text-xs shadow transition flex items-center justify-center space-x-2">
                                    <i class="fa-solid fa-play"></i>
                                    <span>Mulai Kerjakan Soal</span>
                                </button>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function PengaturanView({ schoolInfo, setSchoolInfo, showNotice }) {
            const [form, setForm] = useState({ ...schoolInfo });

            const handleChange = (e) => {
                setForm({ ...form, [e.target.name]: e.target.value });
            };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    setForm({ ...form, logoUrl: evt.target.result });
                    showNotice("Pratinjau Logo", "Logo berhasil diunggah!", "success");
                };
                reader.readAsDataURL(file);
            };

            const handleSave = (e) => {
                e.preventDefault();
                setSchoolInfo(form);
                showNotice("Pengaturan Tersimpan", "Data profil & Kop Surat MTs Buninagara berhasil diperbarui!", "success");
            };

            return (
                <div class="space-y-5 max-w-3xl">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h2 class="text-lg font-bold text-slate-800">Menu Pengaturan Akun & Sekolah</h2>
                        <p class="text-xs text-slate-500">Atur Kop Surat resmi, logo madrasah, alamat, dan data Kepala Sekolah</p>
                    </div>

                    <form onSubmit={handleSave} class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4 text-xs">
                        <div class="flex items-center space-x-4 border-b pb-4">
                            <img src={form.logoUrl} alt="Logo" class="w-20 h-20 rounded-full border-2 border-slate-200 object-cover bg-white" />
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">Upload Logo Baru (JPG / PNG)</label>
                                <input type="file" accept="image/*" onChange={handleLogoUpload} class="text-xs text-slate-500" />
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Nama Madrasah / Sekolah</label>
                            <input type="text" name="namaMadrasah" value={form.namaMadrasah} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-bold" />
                        </div>

                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">NSM / NPSN</label>
                                <input type="text" name="nsm" value={form.nsm} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">No. Telepon / WhatsApp</label>
                                <input type="text" name="telepon" value={form.telepon} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                            </div>
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Alamat Lengkap</label>
                            <input type="text" name="alamat" value={form.alamat} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                        </div>

                        <div>
                            <label class="block font-semibold mb-1 text-slate-700">Email Madrasah</label>
                            <input type="email" name="email" value={form.email} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                        </div>

                        <div class="grid grid-cols-2 gap-3 border-t pt-3">
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">Nama Kepala Sekolah</label>
                                <input type="text" name="kepalaSekolah" value={form.kepalaSekolah} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-semibold" />
                            </div>
                            <div>
                                <label class="block font-semibold mb-1 text-slate-700">NIP Kepala Sekolah</label>
                                <input type="text" name="nipKepala" value={form.nipKepala} onChange={handleChange} class="w-full p-2.5 bg-slate-50 border rounded-xl text-xs" />
                            </div>
                        </div>

                        <button type="submit" class="w-full bg-mts-700 hover:bg-mts-800 text-white font-bold py-3 rounded-xl shadow transition text-xs">
                            Simpan Perubahan Pengaturan
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
